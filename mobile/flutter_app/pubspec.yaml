name: luno_messenger
publish_to: none
description: LUNO Global Messenger Mobile Client ??Connect Beyond Borders
version: 2.0.0+25
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^14.2.0
  http: ^1.3.0
  web_socket_channel: ^3.0.2
  flutter_secure_storage: ^9.2.4
  image_picker: ^1.2.4
  file_picker: ^10.0.0
  record: ^7.1.2
  audioplayers: ^6.8.1
  path_provider: ^2.1.5
  image: ^4.2.0
  camera: ^0.12.2
  video_player: ^2.14.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  package_info_plus: ^9.0.1
  permission_handler: 12.0.0
  flutter_webrtc: 1.6.3 # N2-L: pinned (stage 7 allows the add, version fixed)
  flutter_local_notifications: 22.3.3 # N1-L: pinned (stage 7 allows the add, version fixed)
  url_launcher: ^6.3.3
  flutter_contacts: ^2.6.0
  firebase_core: 5.2.0 # push: pinned (FCM closed-app delivery, version fixed)
  firebase_messaging: 17.1.0 # push: pinned (FCM closed-app delivery, version fixed)
  cryptography: ^2.7.0 # E4: pinned pure-Dart crypto (X25519/Ed25519/HKDF/AES-GCM/PBKDF2)
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  fake_async: ^1.3.3
flutter:
  uses-material-design: true
  # F20: ARB localizations (ko/en/th/ja, same four as the web).
  generate: true
  assets:
    - assets/brand/luno-logo-horizontal-512.png
