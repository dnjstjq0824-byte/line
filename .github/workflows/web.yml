name: Vue Applications CI
on:
  push:
    paths: ['apps/**','scripts/**','wrangler.jsonc','package.json','package-lock.json','.github/workflows/web.yml']
  pull_request:
    paths: ['apps/**','scripts/**','wrangler.jsonc','package.json','package-lock.json','.github/workflows/web.yml']
jobs:
  vue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - run: npm ci
      - run: node --test "scripts/*.test.mjs"
      - run: npm run build:apps
