name: Flutter CI
on:
  push:
    paths: ['mobile/flutter_app/**','.github/workflows/flutter.yml']
  pull_request:
    paths: ['mobile/flutter_app/**','.github/workflows/flutter.yml']
jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - uses: android-actions/setup-android@v3
      - uses: subosito/flutter-action@v2
        with: {channel: 'stable', flutter-version: '3.47.8', cache: true}
      - name: Analyze
        working-directory: mobile/flutter_app
        run: flutter analyze
      - name: Test
        working-directory: mobile/flutter_app
        run: flutter test
      # Debug APK proves the Android build graph (manifest, Gradle, plugins)
      # without touching the release signing material, which stays manual.
      - name: Build debug APK
        working-directory: mobile/flutter_app
        run: flutter build apk --debug
