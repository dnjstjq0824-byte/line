name: Backend CI
on:
  push:
    paths: ['backend/**','database/**','.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**','database/**','.github/workflows/backend.yml']
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: messenger_test
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: messenger_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U messenger_test -d messenger_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod
      - name: Resolve module dependencies
        working-directory: backend
        run: go mod tidy
      - name: Create isolated PostgreSQL schema and replay incremental migrations
        env:
          DATABASE_URL: postgres://messenger_test:ci_only_password@localhost:5432/messenger_test?sslmode=disable
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/001_all_phases.sql
          for pass in 1 2; do
            for migration in database/00[2-5]_*.sql; do
              psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$migration"
            done
          done
      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgres://messenger_test:ci_only_password@localhost:5432/messenger_test?sslmode=disable
        run: go test ./... -race
      - name: Vet
        working-directory: backend
        run: go vet ./...
